project_id = "dnest"

[auth]
site_url = "https://dnest-app.vercel.app"
additional_redirect_urls = [
  "https://dnest-app.vercel.app/auth/callback",
  "http://localhost:3000/auth/callback",
]

[auth.email]
enable_signup = true
enable_confirmations = false
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.deliver-scheduled-notes]
verify_jwt = false
