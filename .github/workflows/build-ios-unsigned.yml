name: Build unsigned iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Remove paid-team App Group entitlements
        working-directory: native/ios
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = Path("project.yml")
          text = project.read_text()
          text = text.replace(
              "    entitlements:\n      path: DNest/DNest.entitlements\n",
              "",
          )
          text = text.replace(
              "    entitlements:\n      path: DNestWidgets/DNestWidgets.entitlements\n",
              "",
          )
          project.write_text(text)
          PY

      - name: Generate Xcode project
        working-directory: native/ios
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: native/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project DNest.xcodeproj \
            -scheme DNest \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        working-directory: native/ios
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/DNest.app package/Payload/
          cd package
          zip -qry ../DNest-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DNest-unsigned-iPhone
          path: native/ios/DNest-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
